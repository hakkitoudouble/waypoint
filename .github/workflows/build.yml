name: build

# Tag a commit (git tag v1.0.0 && git push --tags) and this builds the portable
# Windows package, runs the two checks that need no game saves, and attaches the zip
# to the GitHub release. "Run workflow" builds it without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install --disable-pip-version-check pyinstaller numpy

      - name: Check the interface wiring and translations
        run: |
          python tools/check_ui.py
          python tools/check_i18n.py

      - name: Build the portable package
        run: python build.py

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waypoint-win64
          path: |
            dist/Waypoint-*-win64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Waypoint-*-win64.zip
            dist/SHA256SUMS.txt
          body_path: .github/release-notes.md
